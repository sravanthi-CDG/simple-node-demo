<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Node.js Demo</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 60px auto; text-align: center; color: #222; }
  button { padding: 10px 18px; font-size: 15px; cursor: pointer; }
  pre { text-align: left; background: #f4f4f4; padding: 12px; border-radius: 6px; }
</style>
</head>
<body>
  <h1>🚀 Simple Node.js Demo App</h1>
  <p>This app can be deployed to <b>EC2</b>, <b>Elastic Beanstalk</b>, and <b>Amplify</b>.</p>
  <button onclick="callApi()">Call /api/info</button>
  <pre id="output">Click the button to call the API...</pre>

  <script>
    async function callApi() {
      const res = await fetch('/api/info');
      const data = await res.json();
      document.getElementById('output').textContent = JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
